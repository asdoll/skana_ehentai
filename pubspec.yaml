  # HarmonyOS implementation of file_picker. It is a separate package rather than
  # a replacement for `file_picker` because the OHOS port renames itself
  # (`file_picker_ohos`), and ohpm rejects a plugin whose har name does not match
  # the name the Flutter tooling keys the dependency by. Keeping it apart also
  # means Android/iOS keep the exact file_picker version this project pins, and
  # the port's own Dart copy (plus its extra image_picker dependency) is never
  # pulled in. See third_party/file_picker_ohos and the FilePicker.platform
  # hand-off in main.dart.
  file_picker_ohos:
    path: third_party/file_picker_ohos
  local_auth: ^2.3.0
